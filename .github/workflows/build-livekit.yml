name: Build and push LiveKit image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.livekit
      - livekit.yaml

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push LiveKit image
        run: |
          IMAGE=${{ secrets.ACR_REGISTRY }}/livekit-server:${{ github.sha }}
          docker build -f Dockerfile.livekit -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update livekit-server Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: livekit-server
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ env.IMAGE }}
